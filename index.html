function Slideshow() {
  const [i, setI] = useState(0);
  const [pausa, setPausa] = useState(false);
  const reduz = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  useEffect(() => {
    if (pausa || reduz) return;
    const id = setInterval(() => setI(x => (x + 1) % SLIDES.length), 2000);
    return () => clearInterval(id);
  }, [pausa, reduz]);
  return (
    <div onMouseEnter={() => setPausa(true)} onMouseLeave={() => setPausa(false)} onFocus={() => setPausa(true)} onBlur={() => setPausa(false)}>
      <div className="show">
        {SLIDES.map((s, n) => <div key={s.t} className={"slide" + (n === i ? " on" : "")} aria-hidden={n !== i}>{s.svg}</div>)}
      </div>
      <div className="cap">
        <span>{SLIDES[i].t}</span>
        <div className="dots">
          {SLIDES.map((s, n) => <button key={s.t} className="dot" aria-label={"Ver: " + s.t} aria-current={n === i} onClick={() => setI(n)} />)}
        </div>
      </div>
    </div>
  );
}

}

    <section id="projetos">

        </div>
        <div className="grid">

            <article className="card" key={p.titulo}>
              <div className="thumb" aria-hidden="true">{p.titulo.split(" ").map(w => w[0]).slice(0, 2).join("")}</div>
              <div className="body">

                <p>{p.desc}</p>
                <div className="links">

                  <a href={p.codigo}>Ver código</a>
                </div>
                <div className="tags">{p.tags.map(t => <span key={t}>{t}</span>)}</div>

          ))}

      </div>
    </section>

function Contato() {
  const [nome, setNome] = useState("");
  const [msg, setMsg] = useState("");
  const enviar = () => {
    const assunto = encodeURIComponent("Contato pelo portfólio" + (nome ? " — " + nome : ""));
    window.location.href = `mailto:${PERFIL.email}?subject=${assunto}&body=${encodeURIComponent(msg)}`;
  };
  return (
    <section id="contato">
      <div className="wrap">
        <h2>Vamos conversar</h2>
        <p className="sub">Tem um projeto ou uma vaga em mente? Escreva abaixo e eu respondo por e-mail.</p>
        <div className="contact">
          <label>Seu nome
            <input value={nome} onChange={e => setNome(e.target.value)} autoComplete="name" />
          </label>
          <label>Mensagem
            <textarea value={msg} onChange={e => setMsg(e.target.value)} />
          </label>
          <div className="row">
            <button className="btn primary" onClick={enviar}>Enviar por e-mail</button>
            <a className="btn ghost" href={PERFIL.github}>GitHub</a>
            <a className="btn ghost" href={PERFIL.linkedin}>LinkedIn</a>
          </div>
          <p className="note">O botão abre o seu aplicativo de e-mail com a mensagem pronta.</p>
        </div>
      </div>
    </section>
  );
}

function App() {
  const [tema, setTema] = useState(() =>
    window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const [cor, setCor] = useState(CORES[0].valor);

  useEffect(() => { document.documentElement.setAttribute("data-theme", tema); }, [tema]);
  useEffect(() => { document.documentElement.style.setProperty("--accent", cor); }, [cor]);

  return (
    <>
      <Header tema={tema} setTema={setTema} />
      <main>
        <Hero cor={cor} setCor={setCor} />
        <Projetos />
        <Sobre />
        <Experiencia />
        <Contato />
      </main>
      <footer>
        <div className="wrap">© {new Date().getFullYear()} {PERFIL.nome}. Feito com React.</div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
